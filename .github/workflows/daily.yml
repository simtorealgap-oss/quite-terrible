name: Daily prices and site

on:
  schedule:
    # GitHub starts scheduled runs late when many start on the hour (yesterday: 53 minutes), so these
    # are set 20 minutes early at an off-peak minute: the site is usually fresh by 09:00 local time.
    - cron: '40 23 * * *'  # 08:40 KST = 08:40 JST: Korean and Japanese prices and news
    - cron: '40 13 * * *'  # 08:40 US Eastern (EST; 09:40 in summer): US prices and English news
    - cron: '40 7 * * *'   # 08:40 in Germany (CET; 09:40 in summer): German prices (eBay Germany) and news
  workflow_dispatch:
    inputs:
      region:
        description: 'Which prices and news to collect'
        type: choice
        options: [all, kr, us, de]
        default: all
      post_x:
        description: 'Post the US price card to X (@quiteterribleHQ) after collecting'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        run: python -m unittest discover -s tests
      - name: Collect prices and news
        if: github.event_name != 'push'
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_CAMPAIGN_ID: ${{ secrets.EBAY_CAMPAIGN_ID }}
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          REGION: ${{ github.event.schedule == '40 23 * * *' && '--region kr' || github.event.schedule == '40 13 * * *' && '--region us' || github.event.schedule == '40 7 * * *' && '--region de' || (inputs.region == 'kr' || inputs.region == 'us' || inputs.region == 'de') && format('--region {0}', inputs.region) || '' }}
        # A failing source is recorded in the database and shown on the site; keep publishing.
        # Each morning run refreshes its own region; a manual run refreshes both.
        run: python server.py --update all --force-news $REGION || echo "::warning::Some sources failed, see output above"
      - name: Save collected data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/ramprice.sqlite3
          git diff --cached --quiet || git commit -m "data: daily update"
          git push
      - name: Post today's prices to X
        # Once a day after the US morning run, only while repository variable X_POSTING is 'on'.
        if: (github.event.schedule == '40 13 * * *' && vars.X_POSTING == 'on') || inputs.post_x
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          pip install -q pillow
          python tools/xpost.py --post --card x-card.png || echo "::warning::Posting to X failed, see output above"
      - name: Build site
        # With a custom domain (repository variable CUSTOM_DOMAIN) the site lives at the domain root.
        env:
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          NAVER_SITE_VERIFICATION: ${{ vars.NAVER_SITE_VERIFICATION }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          ADSENSE_SLOT: ${{ vars.ADSENSE_SLOT }}
        run: |
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ]; then
            python build.py --base "" --site-url "https://${{ vars.CUSTOM_DOMAIN }}"
          else
            python build.py --base "/${{ github.event.repository.name }}" --site-url "https://${{ github.repository_owner }}.github.io"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
