name: Daily prices and site

on:
  schedule:
    - cron: '0 0 * * *'    # 09:00 KST: Korean prices and Korean news
    - cron: '0 14 * * *'   # 09:00 US Eastern (EST; 10:00 in summer): US prices and English news
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        run: python -m unittest discover -s tests
      - name: Collect prices and news
        if: github.event_name != 'push'
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_CAMPAIGN_ID: ${{ secrets.EBAY_CAMPAIGN_ID }}
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          REGION: ${{ github.event.schedule == '0 0 * * *' && '--region kr' || github.event.schedule == '0 14 * * *' && '--region us' || '' }}
        # A failing source is recorded in the database and shown on the site; keep publishing.
        # Each morning run refreshes its own region; a manual run refreshes both.
        run: python server.py --update all --force-news $REGION || echo "::warning::Some sources failed, see output above"
      - name: Save collected data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/ramprice.sqlite3
          git diff --cached --quiet || git commit -m "data: daily update"
          git push
      - name: Build site
        # With a custom domain (repository variable CUSTOM_DOMAIN) the site lives at the domain root.
        env:
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          NAVER_SITE_VERIFICATION: ${{ vars.NAVER_SITE_VERIFICATION }}
        run: |
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ]; then
            python build.py --base "" --site-url "https://${{ vars.CUSTOM_DOMAIN }}"
          else
            python build.py --base "/${{ github.event.repository.name }}" --site-url "https://${{ github.repository_owner }}.github.io"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
